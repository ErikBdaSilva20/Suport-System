services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      # Porta 5433 no host para não colidir com um Postgres local já instalado.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./docker/init/00-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build: ./local-gateway
    environment:
      DATABASE_URL: postgres://helpdesk:helpdesk@db:5432/helpdesk
      PORT: 8787
      # CORS_ORIGIN: descomente para restringir a uma lista customizada
      # (separada por vírgula). Sem isso, o local-gateway já libera
      # localhost/127.0.0.1 nas portas padrão do Vite (8080 dev, 4173 preview).
      # CORS_ORIGIN: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
